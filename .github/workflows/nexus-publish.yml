name: Nexus Publish

on:
  workflow_call:
    inputs:
      package-name:
        description: Name of the released zip of a repository that releases one mod (e.g. my-mod gives my-mod-1.2.3.zip). Leave empty when mods-file is set
        required: false
        default: ''
        type: string
      mods-file:
        description: JSON file of a repository that releases several mods, which maps the package name of each mod, the name of its zip without -<version>.zip, to its Nexus Mods settings file-id, mod-id, file-name and file-description. Leave empty for a single mod
        required: false
        default: ''
        type: string
      build-command:
        description: Command that builds the mod, or the mods, and zips it into package-dir
        required: false
        default: npm ci && npm run package
        type: string
      package-dir:
        description: Directory the build command writes the zip to. With mods-file, every zip in it and its subdirectories goes to the release
        required: false
        default: dist
        type: string
      mods-dir:
        description: Directory, inside package-dir, whose zips go to Nexus Mods when mods-file gives them a file id. Zips elsewhere in package-dir only go to the release. Defaults to package-dir
        required: false
        default: ''
        type: string
      version-file:
        description: JSON file inside the zip of a single mod whose version field must match the release, such as info.json for a Vortex extension. Leave empty to skip the check
        required: false
        default: ''
        type: string
      node-version:
        description: Node.js version selector
        required: false
        default: "24"
        type: string
      file-id:
        description: Id of the file on Nexus Mods that each release of a single mod adds a version to. Leave empty to skip Nexus Mods
        required: false
        default: ''
        type: string
      file-name:
        description: Name a single mod's file is listed under on Nexus Mods, followed by the version (e.g. My Mod gives My Mod v1.2.3). Leave empty to list it under the zip's name
        required: false
        default: ''
        type: string
      file-description:
        description: Description of a single mod's file on Nexus Mods
        required: false
        default: ''
        type: string
      primary-mod-manager-download:
        description: Whether each uploaded file is the default download for mod managers
        required: false
        default: false
        type: boolean
      update-mod-version:
        description: Whether each mod's version on Nexus Mods is set to the version uploaded to it
        required: false
        default: true
        type: boolean
      mod-id:
        description: Id of a single mod on Nexus Mods. Required when changelog is set
        required: false
        default: ''
        type: string
      changelog:
        description: Text added to the changelog of each uploaded mod for its uploaded version, such as the release notes. Requires the mod id of every upload
        required: false
        default: ''
        type: string
    secrets:
      NEXUSMODS_API_KEY:
        description: Nexus Mods API key of the mods' author
        required: false

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      uploads: ${{ steps.uploads.outputs.uploads }}
      release-files: ${{ steps.uploads.outputs.release-files }}

    steps:
      - name: Resolve version
        id: version
        uses: Der-Floh/Der-Floh/.github/actions/resolve-version@v1
        with:
          tag: ${{ github.event.release.tag_name }}

      - name: Check inputs
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
          MODS_FILE: ${{ inputs.mods-file }}
          MODS_DIR: ${{ inputs.mods-dir }}
          VERSION_FILE: ${{ inputs.version-file }}
          FILE_ID: ${{ inputs.file-id }}
          FILE_NAME: ${{ inputs.file-name }}
          FILE_DESCRIPTION: ${{ inputs.file-description }}
          MOD_ID: ${{ inputs.mod-id }}
        run: |
          if [ -n "$MODS_FILE" ] && [ -n "$PACKAGE_NAME$VERSION_FILE$FILE_ID$FILE_NAME$FILE_DESCRIPTION$MOD_ID" ]; then
            echo "::error::mods-file is set together with package-name, version-file, file-id, file-name, file-description or mod-id, which only apply to a single mod. With mods-file, the settings of each mod come from that file."
            exit 1
          fi
          if [ -z "$MODS_FILE" ] && [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Neither package-name nor mods-file is set. Set package-name to the name of the released zip of a single mod, or mods-file for a repository that releases several."
            exit 1
          fi
          if [ -z "$MODS_FILE" ] && [ -n "$MODS_DIR" ]; then
            echo "::error::mods-dir is set but mods-file is not, and mods-dir only applies to the mods that mods-file lists."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Pack
        id: pack
        uses: Der-Floh/Der-Floh/.github/actions/nexus-pack@v1
        with:
          package-name: ${{ inputs.package-name }}
          version: ${{ steps.version.outputs.value }}
          build-command: ${{ inputs.build-command }}
          package-dir: ${{ inputs.package-dir }}
          version-file: ${{ inputs.version-file }}

      - name: Resolve uploads
        id: uploads
        uses: Der-Floh/Der-Floh/.github/actions/resolve-nexus-uploads@v1
        with:
          version: ${{ steps.version.outputs.value }}
          package-dir: ${{ inputs.package-dir }}
          package-name: ${{ inputs.package-name }}
          package-path: ${{ steps.pack.outputs.package-path }}
          file-id: ${{ inputs.file-id }}
          mod-id: ${{ inputs.mod-id }}
          file-name: ${{ inputs.file-name }}
          file-description: ${{ inputs.file-description }}
          mods-file: ${{ inputs.mods-file }}
          mods-dir: ${{ inputs.mods-dir }}
          changelog: ${{ inputs.changelog }}

      - name: Check Nexus Mods settings
        if: ${{ !github.event.release.prerelease && steps.uploads.outputs.uploads != '[]' }}
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if [ -z "$NEXUSMODS_API_KEY" ]; then
            echo "::error::A file id is set but the NEXUSMODS_API_KEY secret is not, so the upload to Nexus Mods would fail after the release."
            exit 1
          fi

      - name: Upload mod
        uses: actions/upload-artifact@v7
        with:
          name: mod
          # A wildcard makes package-dir the artifact's root, so zips in its subdirectories keep their paths when downloaded.
          path: ${{ inputs.mods-file != '' && format('{0}/**/*.zip', inputs.package-dir) || steps.pack.outputs.package-path }}
          if-no-files-found: error

  release:
    name: Upload to release
    needs: pack
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download mod
        uses: actions/download-artifact@v8
        with:
          name: mod
          path: ${{ inputs.package-dir }}

      - name: Upload to release
        uses: Der-Floh/Der-Floh/.github/actions/github-release-upload@v1
        with:
          files: ${{ needs.pack.outputs.release-files }}

  nexus:
    name: Nexus Mods (${{ matrix.package-name }})
    needs: [pack, release]
    # An empty matrix fails the job, so it is skipped when nothing goes to Nexus Mods.
    if: ${{ !github.event.release.prerelease && needs.pack.outputs.uploads != '[]' }}
    runs-on: ubuntu-latest

    permissions: {}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pack.outputs.uploads) }}

    steps:
      - name: Download mod
        uses: actions/download-artifact@v8
        with:
          name: mod
          path: ${{ inputs.package-dir }}

      - name: Upload to Nexus Mods
        uses: Der-Floh/Der-Floh/.github/actions/nexus-upload@v1
        with:
          package-path: ${{ matrix.package-path }}
          version: ${{ matrix.version }}
          file-id: ${{ matrix.file-id }}
          api-key: ${{ secrets.NEXUSMODS_API_KEY }}
          display-name: ${{ matrix.display-name }}
          description: ${{ matrix.description }}
          primary-mod-manager-download: ${{ inputs.primary-mod-manager-download }}
          update-mod-version: ${{ inputs.update-mod-version }}
          mod-id: ${{ matrix.mod-id }}
          changelog: ${{ inputs.changelog }}
