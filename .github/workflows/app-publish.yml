name: App Publish

on:
  workflow_call:
    inputs:
      project-path:
        description: Desktop project to publish. It must reference the Velopack package
        required: true
        type: string
      author:
        description: Publisher of the app. It is shown in Apps & Features and is the first part of the WinGet identifier
        required: true
        type: string
      package-name:
        description: Package name without spaces. It names the install folder and the released files and is the second part of the WinGet identifier, so it must never change after the first release
        required: true
        type: string
      splash-image:
        description: Image shown while the installer runs
        required: false
        default: ''
        type: string
      publish-profile:
        description: Publish profile to build with
        required: false
        default: winx64
        type: string
      shortcuts:
        description: Comma separated places the installer creates shortcuts to the app in, or None. Leave empty for Velopack's default, Desktop and StartMenuRoot
        required: false
        default: ''
        type: string
      plain-portable:
        description: Zip the published files as they are as the portable archive, instead of Velopack's portable package, which starts the app through a launcher that runs a command-line app in a window that closes right away
        required: false
        default: false
        type: boolean
      runtimes:
        description: JSON array of runtime identifiers to release installers for
        required: false
        default: '["win-x64", "win-x86", "win-arm64"]'
        type: string
      dotnet-version:
        description: SDK version selector
        required: false
        default: "10.0.x"
        type: string
    secrets:
      WINGET_CREATE_GITHUB_TOKEN:
        description: GitHub PAT used to submit to the WinGet repository
        required: false
      SIXLABORS_LICENSE_KEY:
        description: ImageSharp license key, handed to MSBuild as SixLaborsLicenseKey. Only projects that use ImageSharp 4 or later need it to build in Release
        required: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest

    permissions: {}

    outputs:
      value: ${{ steps.version.outputs.value }}

    steps:
      - name: Resolve version
        id: version
        uses: Der-Floh/Der-Floh/.github/actions/resolve-version@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          allow-prerelease: "false"

  pack:
    name: Pack ${{ matrix.runtime }}
    needs: version
    runs-on: windows-latest

    permissions:
      contents: read

    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    strategy:
      matrix:
        runtime: ${{ fromJSON(inputs.runtimes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Publish
        id: publish
        uses: Der-Floh/Der-Floh/.github/actions/dotnet-publish@v1
        with:
          project-path: ${{ inputs.project-path }}
          runtime: ${{ matrix.runtime }}
          version: ${{ needs.version.outputs.value }}
          publish-profile: ${{ inputs.publish-profile }}

      - name: Pack
        id: pack
        uses: Der-Floh/Der-Floh/.github/actions/velopack-pack@v1
        with:
          project-path: ${{ inputs.project-path }}
          publish-dir: ${{ steps.publish.outputs.dir }}
          runtime: ${{ matrix.runtime }}
          version: ${{ needs.version.outputs.value }}
          author: ${{ inputs.author }}
          package-name: ${{ inputs.package-name }}
          splash-image: ${{ inputs.splash-image }}
          shortcuts: ${{ inputs.shortcuts }}
          portable: ${{ !inputs.plain-portable }}
          output-dir: artifacts

      - name: Zip portable archive
        id: zip
        if: ${{ inputs.plain-portable }}
        uses: Der-Floh/Der-Floh/.github/actions/zip@v1
        with:
          path: ${{ steps.publish.outputs.dir }}
          archive: artifacts/${{ inputs.package-name }}-${{ matrix.runtime }}-Portable.zip
          folder-name: ${{ inputs.package-name }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: velopack-${{ matrix.runtime }}
          path: |
            ${{ steps.pack.outputs.setup-path }}
            ${{ steps.zip.outputs.archive-path || steps.pack.outputs.portable-path }}
          if-no-files-found: error
          retention-days: 3

  verify:
    name: Verify ${{ matrix.runtime }}
    needs: [version, pack]
    runs-on: ${{ endsWith(matrix.runtime, 'arm64') && 'windows-11-arm' || 'windows-latest' }}

    permissions: {}

    strategy:
      matrix:
        runtime: ${{ fromJSON(inputs.runtimes) }}

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          name: velopack-${{ matrix.runtime }}
          path: artifacts

      - name: Verify installer
        uses: Der-Floh/Der-Floh/.github/actions/verify-velopack@v1
        with:
          setup-path: artifacts/${{ inputs.package-name }}-${{ matrix.runtime }}-Setup.exe
          package-name: ${{ inputs.package-name }}
          version: ${{ needs.version.outputs.value }}

  release:
    name: Upload to release
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: velopack-*
          path: artifacts
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            ./artifacts/*-Setup.exe
            ./artifacts/*-Portable.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./artifacts/*-Setup.exe
            ./artifacts/*-Portable.zip

  winget:
    name: WinGet
    needs: release
    if: ${{ !github.event.release.prerelease }}

    permissions:
      contents: read

    uses: Der-Floh/Der-Floh/.github/workflows/app-publish-winget.yml@v1
    with:
      tag: ${{ github.event.release.tag_name }}
      author: ${{ inputs.author }}
      package-name: ${{ inputs.package-name }}
      runtimes: ${{ inputs.runtimes }}
    secrets:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
