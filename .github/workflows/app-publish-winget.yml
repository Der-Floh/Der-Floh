name: App Publish to WinGet

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.2.3)
        required: true
        type: string
      author:
        description: Publisher of the app, the first part of the WinGet identifier
        required: true
        type: string
      package-name:
        description: Package name the released installers are named after, the second part of the WinGet identifier
        required: true
        type: string
      runtimes:
        description: JSON array of runtime identifiers the release has installers for
        required: false
        default: '["win-x64", "win-x86", "win-arm64"]'
        type: string
    secrets:
      WINGET_CREATE_GITHUB_TOKEN:
        description: GitHub PAT used to submit to the WinGet repository
        required: false

jobs:
  publish-winget:
    name: Submit to WinGet
    runs-on: windows-latest

    permissions:
      contents: read

    env:
      WINGET_PACKAGE_ID: ${{ inputs.author }}.${{ inputs.package-name }}

    steps:
      - name: Resolve version
        id: version
        uses: Der-Floh/Der-Floh/.github/actions/resolve-version@v1
        with:
          tag: ${{ inputs.tag }}
          allow-prerelease: "false"

      - name: Resolve WinGet submission mode
        id: winget
        uses: Der-Floh/Der-Floh/.github/actions/resolve-winget-mode@v1
        with:
          package-id: ${{ env.WINGET_PACKAGE_ID }}
          version: ${{ steps.version.outputs.value }}
          token: ${{ github.token }}

      - name: Report missing package
        if: ${{ steps.winget.outputs.mode == 'create' }}
        shell: pwsh
        run: Write-Host "::notice::$env:WINGET_PACKAGE_ID is not in WinGet yet. Submit its first version by hand, for example with komac new; later releases then update it automatically."

      - name: Resolve installer URLs
        id: installers
        if: ${{ steps.winget.outputs.mode == 'update' }}
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          RUNTIMES: ${{ inputs.runtimes }}
        run: |
          $urls = foreach ($runtime in ($env:RUNTIMES | ConvertFrom-Json)) {
              $architecture = $runtime -replace '^win-', ''
              "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$env:PACKAGE_NAME-$runtime-Setup.exe|$architecture"
          }
          "urls<<INSTALLER_URLS" >> $env:GITHUB_OUTPUT
          $urls >> $env:GITHUB_OUTPUT
          "INSTALLER_URLS" >> $env:GITHUB_OUTPUT

      - name: Update WinGet package
        if: ${{ steps.winget.outputs.mode == 'update' }}
        uses: Der-Floh/Der-Floh/.github/actions/winget-update@v1
        with:
          package-id: ${{ env.WINGET_PACKAGE_ID }}
          version: ${{ steps.version.outputs.value }}
          installer-urls: ${{ steps.installers.outputs.urls }}
          token: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
