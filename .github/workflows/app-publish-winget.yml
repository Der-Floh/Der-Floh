name: App Publish to WinGet

# Resubmits a release that is already on GitHub to WinGet, for when the release workflow
# got as far as archiving the manifests but the submission itself did not land. Everything
# it needs comes from the calling repository: github.repository resolves to the caller, so
# the run and artifact lookups read that repository's history rather than this one.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.2.3)
        required: true
        type: string
      winget-package-id:
        description: WinGet package identifier, in Publisher.PackageName form
        required: true
        type: string
      release-workflow:
        description: File name of the workflow that archived the manifests
        required: false
        default: publish.yml
        type: string
      manifest-artifact:
        description: Name of the archived WinGet manifest artifact
        required: false
        default: winget-manifests
        type: string
      manifest-path:
        description: Directory the manifests are downloaded into
        required: false
        default: winget-manifests
        type: string
      target:
        description: Runtime identifier the release was built for
        required: false
        default: win-x64
        type: string
      file-type:
        description: Extension of the released installer
        required: false
        default: msi
        type: string
    secrets:
      WINGET_CREATE_GITHUB_TOKEN:
        description: GitHub PAT used to submit to the WinGet repository
        required: true

jobs:
  publish-winget:
    runs-on: windows-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        uses: Der-Floh/Der-Floh/.github/actions/resolve-version@v1
        with:
          tag: ${{ inputs.tag }}
          allow-prerelease: "false"

      - name: Resolve WinGet submission mode
        id: winget
        uses: Der-Floh/Der-Floh/.github/actions/resolve-winget-mode@v1
        with:
          package-id: ${{ inputs.winget-package-id }}
          version: ${{ steps.version.outputs.value }}
          token: ${{ github.token }}

      - name: Resolve release asset
        id: asset
        if: ${{ steps.winget.outputs.mode != 'skip' }}
        uses: Der-Floh/Der-Floh/.github/actions/resolve-release-asset@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.tag }}
          version: ${{ steps.version.outputs.value }}
          target: ${{ inputs.target }}
          file-type: ${{ inputs.file-type }}
          token: ${{ github.token }}

      - name: Resolve release run
        id: run
        if: ${{ steps.winget.outputs.mode == 'create' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
          MANIFEST_ARTIFACT: ${{ inputs.manifest-artifact }}
        run: |
          $sha = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:TAG" --jq '.sha'
          if (-not $sha) { throw "Tag $env:TAG does not resolve to a commit." }

          $runs = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$env:RELEASE_WORKFLOW/runs?head_sha=$sha&per_page=20" --jq '.workflow_runs[].id')
          if ($runs.Count -eq 0) { throw "No $env:RELEASE_WORKFLOW run found for $env:TAG ($sha)." }

          $runId = $null
          foreach ($candidate in $runs) {
              $artifacts = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --jq '.artifacts[] | select(.expired == false) | .name')
              if ($artifacts -contains $env:MANIFEST_ARTIFACT) { $runId = $candidate; break }
          }
          if (-not $runId) {
              throw "None of the $($runs.Count) $env:RELEASE_WORKFLOW run(s) for $env:TAG ($sha) has an unexpired '$env:MANIFEST_ARTIFACT' artifact. Artifacts expire after 90 days, and runs that failed before the archive step never produced one; re-run the release workflow for that tag."
          }

          Write-Host "Using $env:RELEASE_WORKFLOW run $runId for $env:TAG."
          "id=$runId" >> $env:GITHUB_OUTPUT

      - name: Download WinGet manifests
        if: ${{ steps.winget.outputs.mode == 'create' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.manifest-artifact }}
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: ${{ inputs.manifest-path }}

      - name: Verify WinGet manifest
        if: ${{ steps.winget.outputs.mode == 'create' }}
        uses: Der-Floh/Der-Floh/.github/actions/verify-manifest@v1
        with:
          manifest-path: ${{ inputs.manifest-path }}
          installer-url: ${{ steps.asset.outputs.url }}
          installer-sha256: ${{ steps.asset.outputs.sha256 }}

      - name: Create WinGet package
        if: ${{ steps.winget.outputs.mode == 'create' }}
        uses: Der-Floh/Der-Floh/.github/actions/winget-publish@v1
        with:
          manifest-path: ${{ inputs.manifest-path }}
          token: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}

      - name: Update WinGet package
        if: ${{ steps.winget.outputs.mode == 'update' }}
        uses: Der-Floh/Der-Floh/.github/actions/winget-update@v1
        with:
          package-id: ${{ inputs.winget-package-id }}
          version: ${{ steps.version.outputs.value }}
          installer-url: ${{ steps.asset.outputs.url }}
          token: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
