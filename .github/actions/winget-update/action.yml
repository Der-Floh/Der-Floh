name: Update WinGet Package
description: Submits a new version of an existing WinGet package, derived from the released installers

inputs:
  package-id:
    description: WinGet package identifier, in Publisher.PackageName form
    required: true
  version:
    description: Version number (without v prefix)
    required: true
  installer-urls:
    description: Download URLs of the released installers, one per line. Append |<architecture> to a URL to set its architecture explicitly
    required: true
  token:
    description: GitHub PAT for submitting PR to the WinGet repository
    required: true

runs:
  using: composite
  steps:
    - name: Setup wingetcreate
      id: wingetcreate
      uses: Der-Floh/Der-Floh/.github/actions/setup-wingetcreate@v1

    - name: Update manifests in WinGet
      shell: pwsh
      env:
        WINGET_CREATE_GITHUB_TOKEN: ${{ inputs.token }}
        WINGETCREATE: ${{ steps.wingetcreate.outputs.path }}
        PACKAGE_ID: ${{ inputs.package-id }}
        VERSION: ${{ inputs.version }}
        INSTALLER_URLS: ${{ inputs.installer-urls }}
      run: |
        if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { throw "A GitHub token is required to submit to WinGet." }
        $urls = @($env:INSTALLER_URLS -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
        if ($urls.Count -eq 0) { throw "No installer URLs were given." }

        & $env:WINGETCREATE update $env:PACKAGE_ID --urls @urls --version $env:VERSION --submit --no-open
        if ($LASTEXITCODE -ne 0) { throw "wingetcreate update failed with exit code $LASTEXITCODE." }
